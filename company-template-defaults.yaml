# Company Template Defaults Configuration
# Use with: cookiecutter . --config-file company-template-defaults.yaml
#
# This file allows organizations to set their own defaults for cookiecutter prompts,
# reducing the number of questions users need to answer.
#
# Only the 3 required prompts will be asked:
# - customer_slug
# - description
# - deployment_mode
#
# All other values below will be used as defaults (can be overridden with --no-input=false)

default_context:
  # REQUIRED: These 3 prompts cannot be defaulted and must be answered
  customer_slug: "customer-a"
  description: "Modern data engineering project with Astronomer, Airflow, dbt, and Hydra configuration"
  deployment_mode: "production"

  # OPTIONAL: Company-specific defaults (grouped by topic)

  # Critical Caching Settings
  python_version: "3.12"
  airflow_version: "3.0.6"
  postgres_version: "16"
  runtime_tag: "3.0-10"

  # Container Registry Configuration
  image_repo: "registry.example.com/etl/{{ cookiecutter.customer_slug }}"

  # Security and Enterprise Settings
  secrets_strategy: "azure-key-vault"
  executor: "KubernetesExecutor"
  enable_kerberos: "no"
  author_name: "Data Engineering Team"
  company_domain: "myco.com"
  high_label: "high"
  license: "Proprietary"

  # Environment and Database Settings
  env_name: "dev"
  local_domain: "localhost"
  db_user: "postgres"
  db_password: "postgres"

  # Auto-generated values (usually don't need changes)
  db_name: "{{ cookiecutter.customer_slug.replace('-', '_') }}_etl"
  project_name: "{{ cookiecutter.customer_slug | title }} ETL Project"
  project_slug: "{{ cookiecutter.customer_slug }}-etl"
  year: "2025"

# Port Management Integration
# Set these variables to integrate with your organization's port registry
port_management:
  # These will be set by generate-project.sh based on port reservations
  airflow_host_port: "${AIRFLOW_PORT:-0}"      # 0 = dynamic allocation
  postgres_host_port: "${POSTGRES_PORT:-0}"    # 0 = dynamic allocation

# Example: Company-specific overrides
# Copy this file and modify for your organization:
#
# default_context:
#   # Required prompts (still need to be answered)
#   customer_slug: "customer-a"
#   description: "Data engineering project"
#   deployment_mode: "production"
#
#   # Your company's defaults
#   author_name: "Acme Analytics Team"
#   company_domain: "acme.com"
#   image_repo: "acr.acme.com/data-eng/{{ cookiecutter.customer_slug }}"
#   secrets_strategy: "azure-key-vault"
#   executor: "KubernetesExecutor"
#   license: "Proprietary"
#
# Usage:
# 1. Copy this file to your-company-defaults.yaml
# 2. Modify the values under default_context
# 3. Use with: cookiecutter . --config-file your-company-defaults.yaml
# 4. You'll only be prompted for customer_slug, description, and deployment_mode
#
# Port Management:
# 1. Check port registry: ./scripts/manage-ports.sh status
# 2. Reserve ports for permanent projects: ./scripts/manage-ports.sh reserve <project> <owner> <description>
# 3. For temporary projects: ports will be allocated dynamically