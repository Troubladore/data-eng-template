[tool:pytest]
# Pytest configuration for template testing

# Test discovery  
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Ignore template directories (cookiecutter syntax directories should be excluded)
collect_ignore = ["{{cookiecutter.customer_slug}}-etl"]

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# Test markers
markers =
    unit: Unit tests for individual components (< 1s each)
    smoke: Fastest possible validation tests (< 5s total)
    integration: Integration tests for template generation (< 2m total)
    e2e: End-to-end tests for complete workflows (< 10m total)
    slow: Tests that take longer to run (> 30s each)
    stress: Stress testing and recovery scenarios (< 30m total)
    remote: Tests against published template from GitHub
    astronomer: Tests specific to Astronomer CLI integration
    devcontainer: Tests specific to VS Code DevContainer
    multi_project: Tests for multiple project isolation
    clean_slate: Tests that require completely clean Docker environment
    guidance: Tests for CLAUDE.md documentation consistency and quality

# Minimum version requirements
minversion = 6.0

# Test timeout (in seconds)
timeout = 300

# Coverage options (if pytest-cov is installed)
# addopts = --cov=. --cov-report=html --cov-report=term-missing

# Filterwarnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning