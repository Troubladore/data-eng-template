# Modern Docker Compose setup using custom Airflow image
name: {{cookiecutter.project_slug}}-modern{% if cookiecutter.deployment_mode == 'testing' %}-test{% endif %}

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://admin:admin@postgres:5432/{{cookiecutter.db_name}}
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"
  AIRFLOW__CORE__FERNET_KEY: "Jdt_v-EBOLGPgFutJ2oTnin0bIaZPM3SkM0vAOuj9uU="
  _AIRFLOW_WWW_USER_USERNAME: "admin"
  _AIRFLOW_WWW_USER_PASSWORD: "admin"

x-airflow-volumes: &airflow-volumes
  - ../dags:/opt/airflow/dags:cached
  - ../transforms:/opt/airflow/transforms:cached
  - ../scripts:/opt/airflow/scripts:cached
  - ../conf:/opt/airflow/conf:cached
  - airflow_logs:/opt/airflow/logs

services:
  postgres:
    image: postgres:{{cookiecutter.postgres_version}}
    container_name: {{cookiecutter.project_slug}}-postgres{% if cookiecutter.deployment_mode == 'testing' %}-test{% endif %}
    labels:
      - "de-template.project={{cookiecutter.project_slug}}"
      - "de-template.deployment={{cookiecutter.deployment_mode}}"
      - "de-template.service=postgres"
    environment:
      POSTGRES_DB: "{{cookiecutter.db_name}}"
      POSTGRES_USER: "admin"
      POSTGRES_PASSWORD: "admin"
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "0:5432"  # Dynamic port allocation for parallel development
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    build:
      context: ..
      dockerfile: Dockerfile.airflow
      target: development
    image: {{cookiecutter.project_slug}}-airflow-dev{% if cookiecutter.deployment_mode == 'testing' %}-test{% endif %}
    container_name: {{cookiecutter.project_slug}}-airflow-init{% if cookiecutter.deployment_mode == 'testing' %}-test{% endif %}
    labels:
      - "de-template.project={{cookiecutter.project_slug}}"
      - "de-template.deployment={{cookiecutter.deployment_mode}}"
      - "de-template.service=airflow-init"
    environment: *airflow-env
    user: "50000:0"
    volumes: *airflow-volumes
    command: [
      "bash", "-c",
      "airflow db migrate && airflow connections add --conn-id default --conn-type generic || true"
    ]
    depends_on:
      postgres:
        condition: service_healthy

  airflow-scheduler:
    build:
      context: ..
      dockerfile: Dockerfile.airflow
      target: development
    image: {{cookiecutter.project_slug}}-airflow-dev{% if cookiecutter.deployment_mode == 'testing' %}-test{% endif %}
    container_name: {{cookiecutter.project_slug}}-airflow-scheduler{% if cookiecutter.deployment_mode == 'testing' %}-test{% endif %}
    labels:
      - "de-template.project={{cookiecutter.project_slug}}"
      - "de-template.deployment={{cookiecutter.deployment_mode}}"
      - "de-template.service=airflow-scheduler"
    environment: *airflow-env
    user: "50000:0"
    command: ["airflow", "scheduler"]
    volumes: *airflow-volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-webserver:
    build:
      context: ..
      dockerfile: Dockerfile.airflow
      target: development
    image: {{cookiecutter.project_slug}}-airflow-dev{% if cookiecutter.deployment_mode == 'testing' %}-test{% endif %}
    container_name: {{cookiecutter.project_slug}}-airflow-webserver{% if cookiecutter.deployment_mode == 'testing' %}-test{% endif %}
    labels:
      - "de-template.project={{cookiecutter.project_slug}}"
      - "de-template.deployment={{cookiecutter.deployment_mode}}"
      - "de-template.service=airflow-webserver"
    environment: *airflow-env
    user: "50000:0"
    command: ["airflow", "api-server", "--port", "8080"]
    ports:
      - "0:8080"  # Dynamic port allocation for parallel development
    volumes: *airflow-volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    build:
      context: ..
      dockerfile: Dockerfile.airflow
      target: development
    image: {{cookiecutter.project_slug}}-airflow-dev{% if cookiecutter.deployment_mode == 'testing' %}-test{% endif %}
    container_name: {{cookiecutter.project_slug}}-airflow-dag-processor{% if cookiecutter.deployment_mode == 'testing' %}-test{% endif %}
    labels:
      - "de-template.project={{cookiecutter.project_slug}}"
      - "de-template.deployment={{cookiecutter.deployment_mode}}"
      - "de-template.service=airflow-dag-processor"
    environment: *airflow-env
    user: "50000:0"
    command: ["airflow", "dag-processor"]
    volumes: *airflow-volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # DevContainer service (what VS Code opens into)
  devcontainer:
    image: mcr.microsoft.com/devcontainers/python:{{cookiecutter.python_version}}
    container_name: {{cookiecutter.project_slug}}-devcontainer{% if cookiecutter.deployment_mode == 'testing' %}-test{% endif %}
    labels:
      - "de-template.project={{cookiecutter.project_slug}}"
      - "de-template.deployment={{cookiecutter.deployment_mode}}"
      - "de-template.service=devcontainer"
    command: sleep infinity
    user: "1000:1000"
    init: true
    volumes:
      - ..:/workspaces/{{cookiecutter.project_slug}}
    working_dir: /workspaces/{{cookiecutter.project_slug}}
    depends_on:
      - airflow-webserver
      - airflow-scheduler
      - airflow-dag-processor
      - postgres

volumes:
  pg_data:
  airflow_logs: