name: "{{cookiecutter.project_slug}}"
version: "1.0.0"
profile: "{{cookiecutter.project_slug}}"

# dbt project configuration managed by Hydra
# See conf/transformations/ for environment-specific settings

model-paths: ["models"]
analysis-paths: ["analysis"] 
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]
log-path: "logs"

# Model configuration
models:
  {{cookiecutter.project_slug}}:
    # Bronze layer - raw data ingestion
    bronze:
      +materialized: table
      +schema: bronze
      +tags: ["bronze", "raw"]
      
    # Silver layer - cleaned and normalized  
    silver:
      +materialized: view
      +schema: silver
      +tags: ["silver", "clean"]
      
    # Gold layer - business logic and aggregations
    gold:
      +materialized: table
      +schema: gold  
      +tags: ["gold", "business"]

# Seed configuration
seeds:
  {{cookiecutter.project_slug}}:
    +schema: seeds
    +materialized: table

# Snapshot configuration  
snapshots:
  {{cookiecutter.project_slug}}:
    +target_schema: snapshots
    +strategy: timestamp
    +unique_key: id
    +updated_at: updated_at

# Global variables (can be overridden by Hydra config)
vars:
  # Environment detection
  environment: "{% raw %}{{ env_var('DBT_ENVIRONMENT', 'dev') }}{% endraw %}"
  
  # Feature flags
  enable_data_quality_tests: true
  enable_experimental_models: false
  
  # Data processing settings
  default_lookback_days: 30
  enable_sampling: false
  sample_percentage: 100

# Development hooks
on-run-start:
  - "{% raw %}{{ log('Starting dbt run for ' ~ var('environment') ~ ' environment', info=true) }}{% endraw %}"

on-run-end:
  - "{% raw %}{{ log('dbt run completed successfully', info=true) }}{% endraw %}"
